# ============================================================================
# FLAIR SYNTHESIS CONFIGURATION
# ============================================================================
# Task: Generate FLAIR modality from T1, T1ce, and T2

_parent: "synthesis_base_config.yaml"

synthesis:
  model:
    name: "flair_synthesis_diffusion"
    
  training:
    batchsize: 2
    num_epochs: 5000
    learning_rate: 1.0e-4
    
  data:
    # Target modality
    target_modality: "flair"
    condition_modalities: ["t1", "t1ce", "t2"]
    
  checkpoint:
    save_dir: "./models/flair_synthesis"
    log_dir: "./logs/flair_synthesis"
